name: Weekly issue

# Builds the issue on Sunday and publishes it to dkundnani.bio/newsletter/.
# The Apps Script on the website's mail relay emails it to subscribers on Monday morning.

on:
  schedule:
    - cron: "0 14 * * 0"   # Sundays 14:00 UTC
  workflow_dispatch:
    inputs:
      end:
        description: "Last day of the window (YYYY-MM-DD, default today)"
        required: false
      topic:
        description: "Spotlight topic (default: next in the rotation)"
        required: false

permissions:
  contents: write

concurrency: weekly-issue

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the website
        uses: actions/checkout@v4
        with:
          repository: DKundnani/dkundnani.github.io
          ref: master
          path: site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Used when CLAUDE_CODE_OAUTH_TOKEN is set instead of ANTHROPIC_API_KEY.
      - run: npm install -g @anthropic-ai/claude-code

      - name: Generate issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          END: ${{ inputs.end }}
          TOPIC: ${{ inputs.topic }}
        run: |
          args=(run --site-dir site)
          [ -n "$END" ] && args+=(--end "$END")
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          biomed-ai-watch "${args[@]}"

      - name: Commit archive here
        run: |
          git config --global user.name "biomed-ai-watch[bot]"
          git config --global user.email "biomed-ai-watch@users.noreply.github.com"
          git add data issues social
          git diff --cached --quiet || git commit -m "Issue $(date -u +%F)"
          git push

      - name: Publish to dkundnani.bio
        working-directory: site
        run: |
          git add newsletter newsletter.html
          git diff --cached --quiet && exit 0
          git commit -m "BioMed AI Watch: issue $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
