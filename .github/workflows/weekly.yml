name: Weekly issue

on:
  schedule:
    - cron: "0 14 * * 0"   # Sundays 14:00 UTC; the Apps Script sender emails it Monday morning
  workflow_dispatch:
    inputs:
      end:
        description: "Last day of the window (YYYY-MM-DD, default today)"
        required: false

permissions:
  contents: write

concurrency: weekly-issue

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Generate issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: biomed-ai-watch run ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
      - name: Commit issue
        run: |
          git config user.name "biomed-ai-watch[bot]"
          git config user.email "biomed-ai-watch@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Issue $(date -u +%F)"
          git push
